spring:
  application:
    name: backend

  datasource:
    url: jdbc:postgresql://localhost:7001/postgres
    username: admin
    password: secret123

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true

  mail:
    host: sandbox.smtp.mailtrap.io
    port: 2525
    username: 45efe92a6bb64c
    password: 69d7f20fe78fea
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  security:
    oauth2:
      resourceserver:
        jwt:
          # Must match the "iss" claim in a Cognito access token.
          issuer-uri: http://localhost:4566/us-east-1_a979ddded
          jwk-set-uri: http://localhost:4566/us-east-1_a979ddded/.well-known/jwks.json

cognito:
  region: us-east-1
  user-pool-id: us-east-1_a979ddded
  client-id: 3250fb47e3d74c8dbc494c7bab
  issuer-uri: http://localhost:4566/us-east-1_a979ddded
  jwk-set-uri: http://localhost:4566/us-east-1_a979ddded/.well-known/jwks.json

app:
  mail:
    from: ${MAIL_FROM:no-reply@collabflow.app}
    from-name: ${MAIL_FROM_NAME:CollabFlow}
    enabled: ${MAIL_ENABLED:true}

  profiles:
    active: dev

springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    operations-sorter: method
    tags-sorter: alpha
    try-it-out-enabled: true
    filter: true
    display-request-duration: true
    default-models-expand-depth: 1
    default-model-expand-depth: 1
    doc-expansion: none
    persist-authorization: true
  show-actuator: false
  packages-to-scan: com.tanvan.backend
  paths-to-match: /api/**
  override-with-generic-response: false

aws:
  endpoint-url: http://localhost:4566
  access-key-id: test
  secret-access-key: test
  region: us-east-1

  s3:
    bucket: collabflow-bucket
    path-style-access: true

server:
  port: 8080
