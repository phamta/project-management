spring:
  application:
    name: backend

  datasource:
    url: jdbc:postgresql://localhost:5432/collabflow
    username: postgres
    password: your_password

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true

server:
  port: 8080