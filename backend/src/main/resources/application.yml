spring:
  application:
    name: backend

  datasource:
    url: jdbc:postgresql://localhost:5432/collabflow
    username: postgres
    password: 12345678

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true

jwt:                           # ← ĐÚNG: Đặt ngang hàng với spring
  secret: your-very-secret-key-here-at-least-32-characters
  expiration: 900000 # 15 minutes in milliseconds
  refresh-expiration: 28800000 # 8 hours in milliseconds
  header: Authorization
  prefix: Bearer

# Swagger UI Configuration
springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    operations-sorter: method          # Sắp xếp theo HTTP method
    tags-sorter: alpha                 # Sắp xếp tags theo alphabet
    try-it-out-enabled: true           # Bật nút "Try it out"
    filter: true                       # Bật ô tìm kiếm
    display-request-duration: true     # Hiển thị thời gian request
    default-models-expand-depth: 1     # Độ sâu expand mặc định
    default-model-expand-depth: 1
    doc-expansion: none                # Không tự động expand
    persist-authorization: true        # Lưu token sau khi refresh
  show-actuator: false                 # Ẩn actuator endpoints
  packages-to-scan: com.tanvan.backend # Chỉ scan package này
  paths-to-match: /api/**              # Chỉ hiển thị API endpoints


server:
  port: 8080