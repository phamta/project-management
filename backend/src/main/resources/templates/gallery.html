<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Gallery</title>
    <style>
        body { font-family: sans-serif; padding: 20px; }
        .gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 16px; margin-top: 20px; }
        .gallery img { width: 100%; height: 200px; object-fit: cover; border-radius: 8px; box-shadow: 0 2px 6px rgba(0,0,0,0.15); }
        .item { text-align: center; font-size: 12px; word-break: break-all; }
    </style>
</head>
<body>
    <h1>📸 Ảnh trên Floci S3</h1>

    <input type="file" id="fileInput" accept="image/*">
    <button onclick="upload()">Upload</button>

    <div class="gallery" id="gallery"></div>

    <script>
        const API = '/api/files';

        async function upload() {
            const input = document.getElementById('fileInput');
            if (!input.files.length) return alert('Chọn ảnh trước!');

            const formData = new FormData();
            formData.append('file', input.files[0]);

            const res = await fetch(`${API}/upload`, { method: 'POST', body: formData });
            const msg = await res.text();
            alert(msg);
            loadGallery();
        }

        async function loadGallery() {
            const res = await fetch(API);
            const keys = await res.json();

            const gallery = document.getElementById('gallery');
            gallery.innerHTML = '';

            keys.forEach(key => {
                const div = document.createElement('div');
                div.className = 'item';
                div.innerHTML = `
                    <img src="${API}/${encodeURIComponent(key)}" alt="${key}">
                    <p>${key}</p>
                `;
                gallery.appendChild(div);
            });
        }

        loadGallery();
    </script>
</body>
</html>
