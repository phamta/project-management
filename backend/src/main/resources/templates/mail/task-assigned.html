<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><title>Task mới</title></head>
<body style="font-family: Arial, sans-serif; background:#f4f4f4; padding:20px;">
  <div style="max-width:600px; margin:auto; background:#fff; padding:30px; border-radius:8px;">
    <h2 style="color:#2563eb;">CollabFlow</h2>
    <p>Xin chào <b th:text="${recipientName}">bạn</b>,</p>
    <p><b th:text="${actorName}">Ai đó</b> đã giao cho bạn một task mới:</p>
    <blockquote th:text="${message}"
        style="border-left:4px solid #2563eb; padding-left:12px; color:#555;"></blockquote>
    <a th:href="${actionUrl}"
       style="display:inline-block; background:#2563eb; color:#fff; padding:10px 20px;
              text-decoration:none; border-radius:4px;">Xem chi tiết</a>
    <p style="color:#999; font-size:12px; margin-top:30px;">
      Email tự động từ CollabFlow. Vui lòng không trả lời.
    </p>
  </div>
</body>
</html>
